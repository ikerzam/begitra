# Begitra's site (deploy/releases/compose.yml): the product and download pages, the update
# manifest the app reads, the pages' assets under content-hashed names, and one folder per
# version whose files never change once uploaded. This file is conf.d/default.conf, inside the
# http block, so the map below is at the level nginx needs it.

# Files named by their content, and a version's folder, never change: cached for a year. The
# pages and latest.json name the newest version: asked again every time.
map $uri $begitra_cache {
    ~^/(releases|assets)/  "public, max-age=31536000, immutable";
    default                "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    charset_types text/css text/plain text/xml application/json application/xml image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/json application/xml image/svg+xml;

    # No location adds headers of its own: one that did would drop these. The cache header has no
    # `always`, so a 404 (a file asked for before its upload finished) is never cached.
    add_header Cache-Control $begitra_cache;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
