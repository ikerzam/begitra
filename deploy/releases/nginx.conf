# Begitra's release site (deploy/releases/compose.yml): the download page, the update manifest the
# app reads, and one folder per version whose files never change once uploaded.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    # The manifest and the page name the newest version: asked again every time.
    location = /latest.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location /releases/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
