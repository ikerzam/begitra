[package]
name = "bench"
description = "Benchmark repositories (synthetic generator, real repository fetch) and criterion benches for Begira"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
git-core.workspace = true
repo-index.workspace = true
syntax.workspace = true
git2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[lib]
name = "bench"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/main.rs"

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "discovery"
harness = false

[[bench]]
name = "syntax"
harness = false
