[workspace]
members = [".", "crates/git-core", "crates/repo-index", "crates/syntax", "crates/bench", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.6.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/ikerzam/begitra"

[workspace.dependencies]
git-core = { path = "crates/git-core" }
repo-index = { path = "crates/repo-index" }
syntax = { path = "crates/syntax" }
# Local operations only: no OpenSSL or libssh2 build. Network goes through the git CLI, so the
# user's credential helpers and SSH agent apply.
git2 = { version = "0.21", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "macros"] }
tokio-util = "0.7"
similar = "3"
shell-words = "1"
criterion = "0.8"
tempfile = "3"
notify = "8"
# Highlighting and symbols: syntect on Oniguruma, the engine the `bat` project's syntax set
# (two-face) is written for, and tree-sitter with the seven grammars below; isolated in the
# `syntax` crate.
syntect = { version = "5.3", default-features = false, features = ["parsing", "dump-load", "regex-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
tree-sitter = "0.27"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"

[package]
name = "begitra"
description = "Desktop Git client for reading and reviewing large volumes of AI-generated code on standard Git"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name (a Windows linker issue).
name = "begitra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
# The update check the About section runs, and the relaunch after an install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
git-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
tokio-util.workspace = true
shell-words.workspace = true
repo-index.workspace = true
syntax.workspace = true
notify.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
