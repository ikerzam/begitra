<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Begitra</title>
    <!-- The start-up screen, styled before the body paints. -->
    <link rel="stylesheet" href="/boot.css" />
  </head>
  <body>
    <div class="boot" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="21.5 21.5 981 981" width="96" height="96">
        <defs>
          <linearGradient id="boot-ground" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1A1A1A" />
            <stop offset="1" stop-color="#050505" />
          </linearGradient>
        </defs>
        <rect
          x="24"
          y="24"
          width="976"
          height="976"
          rx="217"
          fill="url(#boot-ground)"
          stroke="#2A2A2A"
          stroke-width="5"
        />
        <g transform="translate(512 512) scale(1.19) translate(-512 -512)">
          <g fill="none" stroke-width="64" stroke-linecap="round">
            <path d="M232,512 C352,326 672,326 792,512" stroke="#38BDF8" />
            <path d="M232,512 C352,698 672,698 792,512" stroke="#3DDC97" />
          </g>
          <circle cx="232" cy="512" r="80" fill="#0C0C0C" />
          <circle cx="232" cy="512" r="60" fill="#EDEDED" />
          <circle cx="792" cy="512" r="80" fill="#0C0C0C" />
          <circle cx="792" cy="512" r="60" fill="#EDEDED" />
          <circle cx="512" cy="512" r="92" fill="#EDEDED" />
        </g>
      </svg>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
