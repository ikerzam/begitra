# Monthly updates for the three ecosystems, minor and patch grouped into one pull request
# each: a Tauri, Vue or libgit2 major is a decision Iker makes himself, the rest is
# noise when split. The actions are pinned by commit, so this is what keeps them fresh.
# Monthly, not weekly: every pull request is a run of its own.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    groups:
      rust:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
