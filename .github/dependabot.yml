# Weekly updates for the three ecosystems, minor and patch grouped into one pull request
# each: a Tauri, Vue or libgit2 major is a decision Iker makes himself, the rest is noise when
# split. The actions are pinned by commit, so this is what keeps them fresh.
# Each pull request runs the Linux checks and a green patch or minor npm or Cargo update merges
# itself (workflows/dependabot.yml); the seven-day cooldown proposes only versions a week old,
# since nobody reads a merge that makes itself and most bad releases are pulled within days.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      rust:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
