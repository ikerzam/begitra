name: Audit

# The dependencies against their advisories, every Monday and on demand. One Ubuntu job of
# about a minute. A failure is a red run, which GitHub mails.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      # What ships is what matters: a development-only advisory is Dependabot's business.
      - name: npm advisories (production dependencies)
        run: pnpm audit --prod --audit-level moderate

      # A prebuilt binary; `cargo install cargo-audit` would compile it on every run.
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-audit

      # Vulnerabilities fail the run; the unmaintained and unsound warnings are printed and
      # do not (today they are eight transitive crates of Tauri and tree-sitter that no
      # version of ours can drop; `--deny warnings` would make the run red every week for
      # something nobody here can fix, which is how a red run stops meaning anything).
      - name: RustSec advisories
        run: cargo audit --file src-tauri/Cargo.lock
