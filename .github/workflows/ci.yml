name: CI

# The checks, run on demand and before a release; nothing here starts by itself.
#
# On a push it would repeat the lefthook pre-push hook, which runs the same suites on Windows.
# What CI adds is the other two platforms, which is worth having before a release and when a
# change touches paths, processes or the filesystem: Actions -> CI -> "Run workflow", and
# `release.yml` calls it.
# `dependabot.yml` calls it on each Dependabot pull request with Ubuntu alone and the job the
# update can break: `web` for npm (about 5 minutes), `rust` for Cargo (about 11).

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: The platforms of the rust job, as a JSON list
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      web:
        description: Run the frontend's checks
        type: boolean
        default: true
      rust:
        description: Run the engine's checks
        type: boolean
        default: true
  workflow_call:
    inputs:
      platforms:
        description: The platforms of the rust job, as a JSON list
        type: string
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      web:
        description: Run the frontend's checks
        type: boolean
        default: true
      rust:
        description: Run the engine's checks
        type: boolean
        default: true

# Nothing here writes; the release workflow that calls it grants the write to its own job.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_MANIFEST: src-tauri/Cargo.toml

jobs:
  web:
    name: web (ubuntu-latest)
    if: inputs.web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Type check (vue-tsc)
        run: pnpm typecheck

      # `tests/tailwind-theme.test.ts` keeps the generated theme equal to what
      # `design/tokens.json` produces, so no separate drift step is needed here.
      - name: Frontend tests (Vitest)
        run: pnpm test:run

      - name: Frontend build (Vite)
        run: pnpm build

  rust:
    name: rust (${{ matrix.os }})
    if: inputs.rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the Linux packages Tauri needs (webkit2gtk and friends)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09
        with:
          # Pinned to a commit, the action no longer reads the toolchain from its ref.
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Rust format check
        run: cargo fmt --all --manifest-path ${{ env.CARGO_MANIFEST }} --check

      - name: Rust lint (clippy)
        run: cargo clippy --workspace --all-targets --manifest-path ${{ env.CARGO_MANIFEST }} -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --manifest-path ${{ env.CARGO_MANIFEST }}

      - name: IPC fixtures are committed up to date
        run: git diff --exit-code -- src/ipc/fixtures
