name: Release

# A tag `v*` runs the repository's checks, then builds the packages on the three platforms,
# signs the updater artifacts with the repository's secrets and uploads everything, with
# `latest.json`, to a draft release. Started by hand it builds the same bundles and keeps
# them as artifacts of the run, releasing nothing: the way to exercise the packaging before
# a tag exists.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: ${{ matrix.label }}
    needs: checks
    # Only this job writes: it creates the draft release and uploads the bundles.
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            args: ""
          - os: windows-latest
            label: windows
            args: ""
          - os: macos-latest
            label: macos-arm64
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            label: macos-x64
            args: "--target x86_64-apple-darwin"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the Linux packages Tauri needs (webkit2gtk and friends)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Refuse to release with the updater's placeholder key
        if: github.event_name == 'push'
        shell: bash
        run: |
          if grep -q "REPLACE_WITH" src-tauri/tauri.conf.json; then
            echo "plugins.updater.pubkey is still the placeholder: run tauri signer generate" >&2
            exit 1
          fi

      - name: Build and upload the bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater's signing key pair: `tauri signer generate`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # No tag name on a manual run: the action builds and releases nothing.
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && format('Begitra {0}', github.ref_name) || '' }}
          releaseBody: "See the assets for the installers. The updater reads latest.json."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          projectPath: .
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}

      # The bundle folder of both layouts: `target/release/bundle` without a target triple,
      # `target/<triple>/release/bundle` with one (the two macOS builds).
      - name: Keep the bundles of a manual build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: bundles-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/*/release/bundle/**/*
          if-no-files-found: error
          retention-days: 7
