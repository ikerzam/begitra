# Git hooks. Install with `pnpm exec lefthook install` (done by the `prepare` script once package.json exists).
# Commands run only when staged files match their glob, so the hooks are safe before the scaffold exists.

pre-commit:
  parallel: true
  commands:
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
    rust-clippy:
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
    rust-unit-tests:
      glob: "*.rs"
      run: cargo test --workspace --lib --manifest-path src-tauri/Cargo.toml
    web-lint:
      glob: "*.{ts,vue,js,mjs,cjs}"
      run: pnpm exec eslint {staged_files}
    web-format:
      glob: "*.{ts,vue,js,mjs,cjs,json,css}"
      run: pnpm exec prettier --check {staged_files}
    web-typecheck:
      glob: "*.{ts,vue}"
      run: pnpm exec vue-tsc --noEmit

pre-push:
  commands:
    rust-tests:
      run: cargo test --workspace --manifest-path src-tauri/Cargo.toml
    web-tests:
      run: pnpm test -- --run

commit-msg:
  commands:
    conventional:
      run: node scripts/check-commit-message.mjs {1}
